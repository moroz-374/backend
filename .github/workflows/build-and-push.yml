name: Build and publish traffic-audit release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from release/release-contract.json
        required: true
        default: 2.7.4-traffic-audit.3
        type: string
      frontend_ref:
        description: Frontend branch, tag, or commit to include
        required: true
        default: feature/traffic-audit
        type: string
      node_ref:
        description: Node branch, tag, or commit to include
        required: true
        default: feature/traffic-audit
        type: string
      publish:
        description: Push immutable images and create the GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: traffic-audit-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/moroz-374/remnawave-backend
  NODE_IMAGE: ghcr.io/moroz-374/remnawave-node

jobs:
  verify:
    name: Verify sources and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out backend
        uses: actions/checkout@v6
        with:
          path: backend
          fetch-depth: 0

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: moroz-374/frontend
          ref: ${{ inputs.frontend_ref }}
          path: frontend
          fetch-depth: 0

      - name: Check out node
        uses: actions/checkout@v6
        with:
          repository: moroz-374/node
          ref: ${{ inputs.node_ref }}
          path: node
          fetch-depth: 0

      - name: Validate release contract and source ownership
        shell: bash
        run: |
          set -euo pipefail
          contract_version="$(jq -r '.version' backend/release/release-contract.json)"
          test "${{ inputs.version }}" = "$contract_version" || {
            echo "Requested version does not match release contract: $contract_version" >&2
            exit 1
          }
          test "$(jq -r '.owner' backend/release/release-contract.json)" = "${{ github.repository_owner }}"
          test "$(git -C backend status --porcelain)" = ""
          test "$(git -C frontend status --porcelain)" = ""
          test "$(git -C node status --porcelain)" = ""

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            node/package-lock.json

      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm run migrate:generate
          npm run build
          npm run test:traffic-audit

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm run start:build

      - name: Build and test node
        working-directory: node
        run: |
          npm ci
          npm run build
          npm run test:traffic-audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build definitions
        run: |
          xray_repository="$(jq -r '.sources.xray.repository' backend/release/release-contract.json)"
          xray_version="$(jq -r '.sources.xray.version' backend/release/release-contract.json)"
          xray_revision="$(jq -r '.sources.xray.revision' backend/release/release-contract.json)"
          xray_amd64_sha256="$(jq -r '.sources.xray.assets.linuxAmd64.sha256' backend/release/release-contract.json)"
          xray_arm64_sha256="$(jq -r '.sources.xray.assets.linuxArm64.sha256' backend/release/release-contract.json)"
          docker buildx build --call=check \
            --file backend/Dockerfile.release \
            --build-context frontend-source=frontend \
            backend
          docker buildx build --call=check \
            --file node/Dockerfile \
            --build-arg "XRAY_CORE_REPOSITORY=$xray_repository" \
            --build-arg "XRAY_CORE_VERSION=$xray_version" \
            --build-arg "XRAY_CORE_REVISION=$xray_revision" \
            --build-arg "XRAY_CORE_AMD64_SHA256=$xray_amd64_sha256" \
            --build-arg "XRAY_CORE_ARM64_SHA256=$xray_arm64_sha256" \
            node

  publish:
    name: Publish immutable images and release assets
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out backend
        uses: actions/checkout@v6
        with:
          path: backend
          fetch-depth: 0

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: moroz-374/frontend
          ref: ${{ inputs.frontend_ref }}
          path: frontend
          fetch-depth: 0

      - name: Check out node
        uses: actions/checkout@v6
        with:
          repository: moroz-374/node
          ref: ${{ inputs.node_ref }}
          path: node
          fetch-depth: 0

      - name: Capture immutable source metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "backend_sha=$(git -C backend rev-parse HEAD)"
            echo "frontend_sha=$(git -C frontend rev-parse HEAD)"
            echo "node_sha=$(git -C node rev-parse HEAD)"
            echo "xray_repository=$(jq -r '.sources.xray.repository' backend/release/release-contract.json)"
            echo "xray_version=$(jq -r '.sources.xray.version' backend/release/release-contract.json)"
            echo "xray_revision=$(jq -r '.sources.xray.revision' backend/release/release-contract.json)"
            echo "xray_amd64_sha256=$(jq -r '.sources.xray.assets.linuxAmd64.sha256' backend/release/release-contract.json)"
            echo "xray_arm64_sha256=$(jq -r '.sources.xray.assets.linuxArm64.sha256' backend/release/release-contract.json)"
            echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.release
          build-contexts: |
            frontend-source=frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.build_time }}
          build-args: |
            BRANCH=main
            __RW_METADATA_VERSION=${{ inputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ steps.source.outputs.backend_sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.source.outputs.frontend_sha }}
            __RW_METADATA_GIT_BRANCH=feature/traffic-audit
            __RW_METADATA_BUILD_TIME=${{ steps.source.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          provenance: mode=max
          sbom: true

      - name: Build and push node
        id: node_image
        uses: docker/build-push-action@v6
        with:
          context: node
          file: node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.NODE_IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.build_time }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.node_sha }}
            org.remnawave.xray.repository=${{ steps.source.outputs.xray_repository }}
            org.remnawave.xray.version=${{ steps.source.outputs.xray_version }}
            org.remnawave.xray.revision=${{ steps.source.outputs.xray_revision }}
            org.remnawave.xray.asset.linux-amd64.sha256=${{ steps.source.outputs.xray_amd64_sha256 }}
            org.remnawave.xray.asset.linux-arm64.sha256=${{ steps.source.outputs.xray_arm64_sha256 }}
          build-args: |
            XRAY_CORE_REPOSITORY=${{ steps.source.outputs.xray_repository }}
            XRAY_CORE_VERSION=${{ steps.source.outputs.xray_version }}
            XRAY_CORE_REVISION=${{ steps.source.outputs.xray_revision }}
            XRAY_CORE_AMD64_SHA256=${{ steps.source.outputs.xray_amd64_sha256 }}
            XRAY_CORE_ARM64_SHA256=${{ steps.source.outputs.xray_arm64_sha256 }}
          provenance: mode=max
          sbom: true

      - name: Attest backend image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Attest node image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.NODE_IMAGE }}
          subject-digest: ${{ steps.node_image.outputs.digest }}
          push-to-registry: true

      - name: Create corresponding source bundle and release manifest
        env:
          VERSION: ${{ inputs.version }}
          CREATED_AT: ${{ steps.source.outputs.build_time }}
          BACKEND_SHA: ${{ steps.source.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.source.outputs.frontend_sha }}
          NODE_SHA: ${{ steps.source.outputs.node_sha }}
          XRAY_REPOSITORY: ${{ steps.source.outputs.xray_repository }}
          XRAY_VERSION: ${{ steps.source.outputs.xray_version }}
          XRAY_REVISION: ${{ steps.source.outputs.xray_revision }}
          XRAY_AMD64_SHA256: ${{ steps.source.outputs.xray_amd64_sha256 }}
          XRAY_ARM64_SHA256: ${{ steps.source.outputs.xray_arm64_sha256 }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          NODE_DIGEST: ${{ steps.node_image.outputs.digest }}
        shell: bash
        run: bash backend/scripts/prepare-github-release-assets.sh

      - name: Attest source bundle
        uses: actions/attest@v4
        with:
          subject-path: artifacts/remnawave-source-${{ inputs.version }}.tar.gz

      - name: Export attested release assets for owner publication
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/remnawave-source-${{ inputs.version }}.tar.gz
            artifacts/release-manifest-${{ inputs.version }}.json
            artifacts/release-notes.md

      - name: Publish job summary
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          NODE_DIGEST: ${{ steps.node_image.outputs.digest }}
        run: |
          {
            echo "### Published ${{ inputs.version }}"
            echo "- Backend: \`$BACKEND_IMAGE@$BACKEND_DIGEST\`"
            echo "- Node: \`$NODE_IMAGE@$NODE_DIGEST\`"
            echo "- \`stable\` was not changed."
          } >> "$GITHUB_STEP_SUMMARY"
