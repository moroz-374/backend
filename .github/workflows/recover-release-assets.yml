name: Recover immutable traffic-audit release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable image version
        required: true
        type: string
      backend_ref:
        description: Exact backend commit used by the images
        required: true
        type: string
      frontend_ref:
        description: Exact frontend commit used by the backend image
        required: true
        type: string
      node_ref:
        description: Exact node commit used by the node image
        required: true
        type: string
      backend_digest:
        description: Existing immutable backend manifest digest
        required: true
        type: string
      node_digest:
        description: Existing immutable node manifest digest
        required: true
        type: string
      created_at:
        description: UTC release timestamp used in the failed publish job
        required: true
        type: string

permissions:
  contents: write
  packages: read
  attestations: write
  id-token: write

concurrency:
  group: traffic-audit-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover source archive and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact backend source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.backend_ref }}
          path: backend
          fetch-depth: 0

      - name: Check out exact frontend source
        uses: actions/checkout@v6
        with:
          repository: moroz-374/frontend
          ref: ${{ inputs.frontend_ref }}
          path: frontend
          fetch-depth: 0

      - name: Check out exact node source
        uses: actions/checkout@v6
        with:
          repository: moroz-374/node
          ref: ${{ inputs.node_ref }}
          path: node
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable inputs and registry digests
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          NODE_DIGEST: ${{ inputs.node_digest }}
        run: |
          set -euo pipefail
          test "$(jq -r '.version' backend/release/release-contract.json)" = "$VERSION"
          test "$(git -C backend rev-parse HEAD)" = "${{ inputs.backend_ref }}"
          test "$(git -C frontend rev-parse HEAD)" = "${{ inputs.frontend_ref }}"
          test "$(git -C node rev-parse HEAD)" = "${{ inputs.node_ref }}"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$NODE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          backend_actual="sha256:$(docker buildx imagetools inspect \
            "ghcr.io/moroz-374/remnawave-backend:$VERSION" --raw | sha256sum | cut -d ' ' -f 1)"
          node_actual="sha256:$(docker buildx imagetools inspect \
            "ghcr.io/moroz-374/remnawave-node:$VERSION" --raw | sha256sum | cut -d ' ' -f 1)"
          test "$backend_actual" = "$BACKEND_DIGEST"
          test "$node_actual" = "$NODE_DIGEST"

      - name: Create corresponding source bundle and release manifest
        env:
          VERSION: ${{ inputs.version }}
          CREATED_AT: ${{ inputs.created_at }}
          BACKEND_SHA: ${{ inputs.backend_ref }}
          FRONTEND_SHA: ${{ inputs.frontend_ref }}
          NODE_SHA: ${{ inputs.node_ref }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          NODE_DIGEST: ${{ inputs.node_digest }}
        shell: bash
        run: bash backend/scripts/prepare-github-release-assets.sh

      - name: Attest recovered source bundle
        uses: actions/attest@v4
        with:
          subject-path: artifacts/remnawave-source-${{ inputs.version }}.tar.gz

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ inputs.backend_ref }}" \
            --title "$VERSION" \
            --notes-file artifacts/release-notes.md \
            "artifacts/remnawave-source-${VERSION}.tar.gz" \
            "artifacts/release-manifest-${VERSION}.json"
