name: Promote accepted release to stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Accepted immutable release version
        required: true
        type: string
      backend_digest:
        description: Accepted backend sha256 digest
        required: true
        type: string
      node_digest:
        description: Accepted node sha256 digest
        required: true
        type: string
      acceptance_confirmed:
        description: Confirm that acceptance passed
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: traffic-audit-stable
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/moroz-374/remnawave-backend
  NODE_IMAGE: ghcr.io/moroz-374/remnawave-node

jobs:
  promote:
    if: ${{ inputs.acceptance_confirmed }}
    runs-on: ubuntu-latest
    environment: release-stable
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-traffic-audit\.[0-9]+$ ]]
          [[ "${{ inputs.backend_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.node_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify accepted immutable tags
        shell: bash
        run: |
          set -euo pipefail
          backend_actual="$(docker buildx imagetools inspect "$BACKEND_IMAGE:${{ inputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          node_actual="$(docker buildx imagetools inspect "$NODE_IMAGE:${{ inputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$backend_actual" = "${{ inputs.backend_digest }}"
          test "$node_actual" = "${{ inputs.node_digest }}"

      - name: Promote exact digests to stable
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:stable" \
            "$BACKEND_IMAGE@${{ inputs.backend_digest }}"
          docker buildx imagetools create \
            --tag "$NODE_IMAGE:stable" \
            "$NODE_IMAGE@${{ inputs.node_digest }}"

      - name: Record promotion summary
        env:
          VERSION: ${{ inputs.version }}
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
          NODE_DIGEST: ${{ inputs.node_digest }}
        run: |
          {
            echo '### Stable promotion'
            echo "- Version: \`$VERSION\`"
            echo "- Backend: \`$BACKEND_IMAGE@$BACKEND_DIGEST\`"
            echo "- Node: \`$NODE_IMAGE@$NODE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
