services:
  nginx:
    image: nginx:1.30.3-alpine-slim
    container_name: remnawave-nginx
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      SUB_PUBLIC_DOMAIN: ${SUB_PUBLIC_DOMAIN:?SUB_PUBLIC_DOMAIN is required}
      NGINX_ENVSUBST_FILTER: ^(PANEL_DOMAIN|SUB_PUBLIC_DOMAIN)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./remnawave.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./acme:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - remnawave-network
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  remnawave-network:
    name: remnawave-network
    external: true
