services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: remnawave-caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      SUB_PUBLIC_DOMAIN: ${SUB_PUBLIC_DOMAIN:?SUB_PUBLIC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - remnawave-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  remnawave-network:
    name: remnawave-network
    external: true

volumes:
  caddy-data:
    name: remnawave-caddy-data
  caddy-config:
    name: remnawave-caddy-config
